<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seul Sabores - Pedido Online</title>
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

    <header>
        <div class="header-content">
            <img src="img/logo.jpg" alt="Logo" class="header-logo" onerror="this.style.display='none'">
            <h1>Seul Sabores</h1>
        </div>
        <p>Faça seu pedido direto pelo WhatsApp</p>
    </header>

    <div class="container" id="menu-container"></div>

    <div class="container">
        <!-- 주문 방식 선택 (매장 픽업 / 배달) -->
        <div class="section-box">
            <label>Tipo de Pedido</label>
            <div class="payment-options">
                <label>
                    <input type="radio" name="orderType" value="Retirada" checked onchange="toggleOrderType()"> Retirada na Loja (매장 픽업)
                </label>
                <label>
                    <input type="radio" name="orderType" value="Entrega" onchange="toggleOrderType()"> Entrega (배달)
                </label>
            </div>
        </div>

        <!-- 배달 선택 시에만 나타나는 주소 입력 창 -->
        <div class="section-box" id="address-box" style="display: none;">
            <label for="delivery-address">Endereço de Entrega</label>
            <textarea id="delivery-address" rows="2" placeholder="Ex: Rua, Número, Bairro, Ponto de referência..."></textarea>
        </div>

        <!-- 결제 수단 영역 -->
        <div class="section-box">
            <label>Forma de Pagamento</label>
            <div class="payment-options" id="payment-options-container">
                <label>
                    <input type="radio" name="payment" value="Pix" checked> Pix
                </label>
                <label>
                    <input type="radio" name="payment" value="Dinheiro"> Dinheiro
                </label>
            </div>
        </div>

        <div class="section-box">
            <label for="order-notes">Observações</label>
            <textarea id="order-notes" rows="2" placeholder="Ex: Troco para R$ 50..."></textarea>
        </div>
    </div>

    <div class="footer-bar">
        <div class="total-display">
            Total: <span id="total-price">R$ 0,00</span>
        </div>
        <button class="whatsapp-btn" onclick="sendWhatsAppOrder()">
            📱 Finalizar pedido
        </button>
    </div>

    <!-- 스크립트 파일 연결 (버전 업데이트 반영: v=1.2) -->
    <script src="script.js?v=1.3"></script>
</body>
</html>
